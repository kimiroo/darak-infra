---
- name: Install Clevis TPM2 packages
  ansible.builtin.package:
    name:
      - clevis
      - clevis-tpm2
      - clevis-luks
      - clevis-systemd
    state: present

- name: Nuke NVMe drive
  ansible.builtin.command: wipefs -a /dev/nvme0n1

- name: Init drive with GPT label
  community.general.parted:
    device: /dev/nvme0n1
    label: gpt
    number: 1
    flags: [ lvm ]
    part_start: 0%
    part_end: 100GiB
    state: present

- name: Nuke partition internal LUKS header
  ansible.builtin.command: wipefs -a /dev/nvme0n1p1

- name: Create LUKS container with host password
  community.crypto.luks_device:
    device: /dev/nvme0n1p1
    passphrase: "{{ luks_passwords[inventory_hostname] }}"
    state: present
  no_log: true

- name: Bind LUKS partition to TPM2 via Clevis (PCR 0+7)
  ansible.builtin.shell: >
    echo -n "{{ luks_passwords[inventory_hostname] }}" |
    clevis luks bind -y -k - -d /dev/nvme0n1p1 tpm2 '{"pcr_bank":"sha256","pcr_ids":"0,7"}'
  no_log: true

- name: Enable Clevis askpass path for automatic unlock at boot
  ansible.builtin.systemd:
    name: clevis-luks-askpass.path
    enabled: true
    state: started

- name: Configure crypttab for automatic Clevis unlock
  community.general.crypttab:
    name: crypt_nvme
    backing_device: /dev/nvme0n1p1
    password: none
    opts: discard,_netdev
    state: present

- name: Open LUKS container
  community.crypto.luks_device:
    device: /dev/nvme0n1p1
    name: crypt_nvme
    passphrase: "{{ luks_passwords[inventory_hostname] }}"
    allow_discards: true
    state: opened

- name: Create LVM Physical Volume on LUKS device
  community.general.lvm_pv:
    device: /dev/mapper/crypt_nvme
    state: present

- name: Create LVM Volume Group
  community.general.lvg:
    vg: vg_nvme
    pvs: /dev/mapper/crypt_nvme
    state: present

- name: Create LVM Thin Pool
  community.general.lvol:
    vg: vg_nvme
    thinpool: "nvme-lvm-thin"
    size: 100%FREE
    state: present