---
- name: Add Docker CE Repository for RHEL
  ansible.builtin.copy:
    src: docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    owner: root
    group: root
    mode: '0644'

- name: Update DNF cache
  become: true
  ansible.builtin.dnf:
    update_cache: yes

- name: Install Docker Engine
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Enable and start Docker Engine
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started