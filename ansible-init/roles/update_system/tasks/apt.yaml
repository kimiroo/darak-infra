---
- name: Update APT cache
  become: true
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 1

- name: Upgrade all packages
  become: true
  ansible.builtin.apt:
    upgrade: full

- name: Autoremove unused packages
  become: true
  ansible.builtin.apt:
    autoremove: yes
    purge: yes