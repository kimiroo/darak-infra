---
- name: Set Template VM ID
  ansible.builtin.set_fact:
    template_id: "9{{ node_id }}00"

- name: Set Docker VM ID
  ansible.builtin.set_fact:
    vm_id: "{{ node_id }}01"

- name: Set Docker VM name
  ansible.builtin.set_fact:
    vm_name: "rocky-docker-01"

- name: Set K3s master VM IPv4 address
  ansible.builtin.set_fact:
    vm_ip: "10.10.20.{{ node_id }}1/16"

- name: Set K3s master VM IPv6 address
  ansible.builtin.set_fact:
    vm_ip6: "fdab:d9c3:fb50:10:20::{{ node_id }}1/64"

- name: Set Docker VM tags
  ansible.builtin.set_fact:
    vm_tags: "k3s-worker,node-01"

- name: Stop existing Docker VM
  ansible.builtin.command: >
    qm stop {{ vm_id }}
  failed_when: false

- name: Delete existing Docker VM
  ansible.builtin.command: >
    qm destroy {{ vm_id }} --purge --destroy-unreferenced-disks
  failed_when: false

- name: Clone Template VM
  ansible.builtin.command: >
    qm clone {{ template_id }} {{ vm_id }} --full \
      --storage {{ docker.storage }} \
      --name {{ vm_name }} \
      --format raw

- name: Configure Docker VM
  ansible.builtin.command: >
    qm set {{ vm_id }} \
      --cores {{ docker.cores }} --memory {{ docker.memory }} \
      --ipconfig0 ip={{ vm_ip }},gw={{ k3s_master.gateway }},ip6={{ vm_ip6 }},gw6={{ k3s_master.gateway6 }} \
      --tags {{ vm_tags }} \
      {{ docker.devices | join(' ') }} \
      --onboot 1